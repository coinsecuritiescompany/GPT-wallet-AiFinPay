name: production-audit-fix-once

on:
  push:
    branches:
      - security/production-audit-20260816

permissions:
  contents: write

env:
  CI: true

jobs:
  audit-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/production-audit-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reproduce production audit failure
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          set +e
          npm audit --omit=dev --audit-level=high > /tmp/audit-before.txt 2>&1
          before_status=$?
          set -e
          cat /tmp/audit-before.txt
          if [ "$before_status" -eq 0 ]; then
            echo "Audit already clean; nothing to patch."
            exit 0
          fi
      - name: Apply npm-supported lockfile-only remediation
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          npm audit fix --package-lock-only --omit=dev
          npm ci
          npm run check
          npm audit --omit=dev --audit-level=high
          git diff -- package.json package-lock.json
          if ! git diff --quiet -- package.json; then
            echo "::error::npm audit fix changed package.json; refusing automated dependency-contract change"
            exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "::error::Audit was red but no lockfile change was produced"
            exit 1
          fi
      - name: Commit verified lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(wallet): remediate production dependency advisories"
          git push origin HEAD:security/production-audit-20260816
