name: Update Casper lockfile

on:
  push:
    branches: [agent/casper-native-send-2026-07-31]
    paths:
      - apps/mcp-server/package.json
      - apps/wallet-widget/package.json
      - .github/workflows/update-casper-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/casper-native-send-2026-07-31
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock Casper SDK dependencies"
          git push origin HEAD:agent/casper-native-send-2026-07-31
