name: Remediation schema patch

on:
  push:
    branches:
      - security/system-remediation-2026-08-07

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/system-remediation-2026-08-07
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch network-aware recipient schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mcp-server/src/tools/register-tools.ts')
          s = p.read_text()
          old = s
          s = s.replace('decimalAmountSchema, evmAddressSchema, idempotencyKeySchema', 'decimalAmountSchema, idempotencyKeySchema')
          s = s.replace('recipient: evmAddressSchema,', 'recipient: z.string().min(1).max(256),')
          s = s.replace('allowedRecipients: z.array(evmAddressSchema).default([]),', 'allowedRecipients: z.array(z.string().min(1).max(256)).default([]),')
          if s == old:
              raise SystemExit('expected schema patterns were not found')
          p.write_text(s)
          PY
      - run: npm run check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mcp-server/src/tools/register-tools.ts
          git commit -m "fix(wallet): accept recipients for every supported network"
          git push origin HEAD:security/system-remediation-2026-08-07
