name: Remediation lockfile refresh

on:
  push:
    branches:
      - security/system-remediation-2026-08-07

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/system-remediation-2026-08-07
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply non-breaking production dependency security fixes
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verify high-severity production audit is clean
        run: npm audit --audit-level=high --omit=dev
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): refresh audited lockfile"
          git push origin HEAD:security/system-remediation-2026-08-07
